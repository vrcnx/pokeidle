<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark outer circle - defines the boundary, nothing can stick out -->
  <circle cx="32" cy="32" r="32" fill="#2a1808"/>
  <!-- Red inner area -->
  <circle cx="32" cy="32" r="28" fill="#c83030"/>
  <!-- Cream bottom half -->
  <path d="M4,32 A28,28 0 0,0 60,32 Z" fill="#e8dcc0"/>
  <!-- Dark center band lines -->
  <rect x="4" y="29" width="18" height="6" fill="#2a1808"/>
  <rect x="42" y="29" width="18" height="6" fill="#2a1808"/>
  <!-- Center button -->
  <circle cx="32" cy="32" r="10" fill="#e8dcc0"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#2a1808" stroke-width="4"/>
  <circle cx="32" cy="32" r="5" fill="#2a1808"/>
</svg>
