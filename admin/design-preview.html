<title>Admin preview</title>
<!--
  Dev-only preview of the REAL admin pages with mock data.

  The dashboard is behind an admin session, so the only way to look at a page
  was to sign in. This mounts the genuine components — same JSX, same CSS, only
  the network replaced — so layout can be reviewed without a login, a database
  or a running API.

  The previous version of this file was hand-written HTML imitating the pages.
  Imitation is worth very little: it says the primitives look fine while the
  actual page can be broken in ways the mock never reproduces.

  Vite only bundles what index.html reaches, and nothing in the app imports the
  entry below, so this never ships.

    cd admin && npm run dev  ->  http://localhost:5174/design-preview.html
-->
</head>

  <div id="root"></div>
  <script type="module" src="/src/design-preview.tsx"></script>
